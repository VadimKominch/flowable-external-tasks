plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'by.kominch'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.flowable:flowable-bom:7.2.0")
    implementation "org.flowable:flowable-spring-boot-starter"
    implementation "org.flowable:flowable-spring-boot-starter-rest"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    implementation "org.flowable:flowable-spring-boot-starter-process"
    implementation "org.flowable:flowable-spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0"

    implementation "org.springframework.boot:spring-boot-starter-web"

    // Provides the JSR-223 'groovy' script engine for BPMN groovy scriptTasks
    implementation "org.apache.groovy:groovy-jsr223"

    runtimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
}